name: Build CodaVybes Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate required web secrets
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$VITE_SUPABASE_URL" || { echo "::error::VITE_SUPABASE_URL is missing"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY is missing"; exit 1; }

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build CodaVybes web client
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_PLATFORM: android
          VITE_APP_VERSION: 1.0.1
        run: npm run build

      - name: Install Capacitor dependencies
        working-directory: platforms/mobile-capacitor
        run: npm install --no-audit --no-fund

      - name: Generate and sync Android project
        working-directory: platforms/mobile-capacitor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Configure Firebase push notifications when available
        shell: bash
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning::ANDROID_GOOGLE_SERVICES_JSON_BASE64 is missing; debug APK will not receive terminated-app FCM notifications"
            exit 0
          fi
          echo "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 --decode > platforms/mobile-capacitor/android/app/google-services.json
          python - <<'PYJSON'
          import json
          from pathlib import Path
          path = Path('platforms/mobile-capacitor/android/app/google-services.json')
          data = json.loads(path.read_text())
          packages = [
              c.get('client_info', {}).get('android_client_info', {}).get('package_name')
              for c in data.get('client', [])
          ]
          if 'app.codavybes.social' not in packages:
              raise SystemExit('google-services.json does not contain package app.codavybes.social')
          print('Firebase Android config validated')
          PYJSON

      - name: Apply CodaVybes branding
        run: node scripts/apply-android-branding.mjs

      - name: Apply Android version metadata
        env:
          CODAVYBES_VERSION: 1.0.1
          CODAVYBES_BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/apply-android-version.mjs

      - name: Build installable debug APK
        working-directory: platforms/mobile-capacitor/android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodaVybes-Android-Debug-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: platforms/mobile-capacitor/android/app/build/outputs/apk/debug/app-debug.apk
