name: Build CodaVybes Android Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate production secrets
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY ANDROID_GOOGLE_SERVICES_JSON_BASE64 ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name:-}" || { echo "::error::$name is missing"; exit 1; }
          done

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build web client
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_PLATFORM: android
          VITE_APP_VERSION: 1.0.1
        run: npm run build

      - name: Install Capacitor dependencies
        working-directory: platforms/mobile-capacitor
        run: npm install --no-audit --no-fund

      - name: Generate and sync Android project
        working-directory: platforms/mobile-capacitor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Configure Firebase push notifications
        shell: bash
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 --decode > platforms/mobile-capacitor/android/app/google-services.json
          python - <<'PYJSON'
          import json
          from pathlib import Path
          path = Path('platforms/mobile-capacitor/android/app/google-services.json')
          data = json.loads(path.read_text())
          packages = [
              c.get('client_info', {}).get('android_client_info', {}).get('package_name')
              for c in data.get('client', [])
          ]
          if 'app.codavybes.social' not in packages:
              raise SystemExit('google-services.json does not contain package app.codavybes.social')
          print('Firebase Android config validated')
          PYJSON

      - name: Apply CodaVybes Android branding
        run: node scripts/apply-android-branding.mjs

      - name: Apply Android version metadata
        env:
          CODAVYBES_VERSION: 1.0.1
          CODAVYBES_BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/apply-android-version.mjs

      - name: Decode and validate release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os
          from pathlib import Path
          raw = ''.join(os.environ['ANDROID_KEYSTORE_BASE64'].strip().split())
          try:
              data = base64.b64decode(raw, validate=True)
          except Exception as exc:
              raise SystemExit(f'ANDROID_KEYSTORE_BASE64 is not valid Base64: {exc}')
          if len(data) < 100:
              raise SystemExit(f'Decoded keystore is unexpectedly small ({len(data)} bytes)')
          path = Path('platforms/mobile-capacitor/android/app/codavybes-release.jks')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(data)
          print(f'Decoded signing keystore ({len(data)} bytes)')
          PY

          KEYSTORE="${GITHUB_WORKSPACE}/platforms/mobile-capacitor/android/app/codavybes-release.jks"
          STORE_TYPE=""
          for candidate in PKCS12 JKS; do
            if keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_STORE_PASSWORD" -storetype "$candidate" >/dev/null 2>&1; then
              STORE_TYPE="$candidate"
              break
            fi
          done
          test -n "$STORE_TYPE" || { echo "::error::Keystore cannot be opened as PKCS12 or JKS"; exit 1; }
          keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_STORE_PASSWORD" -storetype "$STORE_TYPE" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1 || {
            echo "::error::ANDROID_KEY_ALIAS does not exist in the keystore"; exit 1;
          }
          echo "CODAVYBES_KEYSTORE_TYPE=$STORE_TYPE" >> "$GITHUB_ENV"

      - name: Add release signing configuration
        shell: bash
        run: |
          cat >> platforms/mobile-capacitor/android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  codavybesRelease {
                      storeFile file(System.getenv("CODAVYBES_KEYSTORE_FILE"))
                      storePassword System.getenv("CODAVYBES_STORE_PASSWORD")
                      keyAlias System.getenv("CODAVYBES_KEY_ALIAS")
                      keyPassword System.getenv("CODAVYBES_KEY_PASSWORD")
                      storeType System.getenv("CODAVYBES_KEYSTORE_TYPE")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.codavybesRelease
                  }
              }
          }
          GRADLE

      - name: Build signed APK and AAB
        working-directory: platforms/mobile-capacitor/android
        env:
          CODAVYBES_KEYSTORE_FILE: ${{ github.workspace }}/platforms/mobile-capacitor/android/app/codavybes-release.jks
          CODAVYBES_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          CODAVYBES_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CODAVYBES_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Upload signed Android release
        uses: actions/upload-artifact@v4
        with:
          name: CodaVybes-Android-Release-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            platforms/mobile-capacitor/android/app/build/outputs/apk/release/*.apk
            platforms/mobile-capacitor/android/app/build/outputs/bundle/release/*.aab
