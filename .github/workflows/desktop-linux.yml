name: Build CodaVybes Linux Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  linux:
    name: Linux desktop bundles
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            rpm

      - name: Install web dependencies
        run: npm ci

      - name: Install desktop dependencies
        working-directory: platforms/desktop-tauri
        run: npm install

      - name: Build Linux app
        working-directory: platforms/desktop-tauri
        run: npm run build:linux

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: codavybes-linux-desktop
          if-no-files-found: error
          path: |
            platforms/desktop-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            platforms/desktop-tauri/src-tauri/target/release/bundle/deb/*.deb
            platforms/desktop-tauri/src-tauri/target/release/bundle/rpm/*.rpm
