[package]
name = "vybe"
version = "1.0.0"
description = "VYBE desktop client"
authors = ["VYBE"]
edition = "2021"

[lib]
name = "vybe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
