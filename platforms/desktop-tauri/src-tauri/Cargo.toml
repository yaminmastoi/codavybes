[package]
name = "codavybes"
version = "13.3.0"
description = "CodaVybes powered by CodaBite"
authors = ["CodaBite"]
edition = "2021"

[lib]
name = "codavybes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
